[package]
name = "tidycraft-cli"
description = "Headless asset lint for game projects — the Tidycraft check pipeline in CI"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "tidycraft"
path = "src/main.rs"

[dependencies]
# `default-features = false` keeps the LLM providers (reqwest) and libgit2 out
# of the binary — the check pipeline needs neither.
tidycraft-core = { path = "../tidycraft-core", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
