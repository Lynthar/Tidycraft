name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''
          - platform: 'windows-latest'
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Same major as ci.yml — a release built on a floating `lts/*`
          # could silently use a different Node than the CI that vetted it.
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      # Fail the release up-front on version drift or a prerelease suffix
      # (the Windows MSI bundler would otherwise reject it mid-build). Must
      # run BEFORE tauri-action, whose beforeBuildCommand (`pnpm build`)
      # starts by rewriting the derived files in place.
      - name: Check version sync
        run: node scripts/sync-version.mjs --check

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      # `beforeBuildCommand` stages the CLI as a sidecar, and the bundler looks
      # it up by the triple it is building FOR — which is not the host when both
      # macOS artifacts come off one arm64 runner.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIDYCRAFT_SIDECAR_TARGET: ${{ matrix.target }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tidycraft ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads
            - **Windows**: `.msi` installer or `-setup.exe` installer (both install; there is no portable build)
            - **macOS (Apple Silicon)**: `_aarch64.dmg`
            - **macOS (Intel)**: `_x64.dmg`
            - **Linux**: `.deb`, `.rpm` or `.AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The standalone CLI download is the same file the app bundles: taken from
      # what the build above already staged, not rebuilt, so the two can never
      # be different builds of the same version.
      - name: Upload the standalone CLI binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          case "${{ matrix.platform }}+${{ matrix.target }}" in
            macos-latest+aarch64-apple-darwin) triple=aarch64-apple-darwin; out=tidycraft-cli-macos-aarch64 ;;
            macos-latest+x86_64-apple-darwin)  triple=x86_64-apple-darwin;  out=tidycraft-cli-macos-x86_64 ;;
            ubuntu-22.04+)                     triple=x86_64-unknown-linux-gnu; out=tidycraft-cli-linux-x86_64 ;;
            windows-latest+)                   triple=x86_64-pc-windows-msvc; out=tidycraft-cli-windows-x86_64.exe ;;
          esac
          src="src-tauri/binaries/tidycraft-$triple"
          [ "${{ matrix.platform }}" = "windows-latest" ] && src="$src.exe"
          test -f "$src" || { echo "sidecar missing: $src"; ls -la src-tauri/binaries/ || true; exit 1; }
          cp "$src" "$out"
          gh release upload "${{ github.ref_name }}" "$out" --clobber
