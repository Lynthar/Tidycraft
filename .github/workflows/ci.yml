name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository — it publishes nothing. Stating that here
# overrides whatever the repository default happens to be, so a token that
# leaks through a build script or a compromised action can't write.
# (release.yml grants `contents: write` on its build job, where it is needed.)
permissions:
  contents: read

# Cancel old runs on the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      # Must run BEFORE `pnpm build`: build's first step is sync-version in
      # write mode, which would silently repair any drift on the runner and
      # let it land on main unnoticed.
      - name: Check version sync
        run: node scripts/sync-version.mjs --check

      # `components:` is required — dtolnay/rust-toolchain installs the
      # minimal profile, which ships neither rustfmt nor clippy.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cheap and compile-free, so it runs before anything expensive.
      - name: Rust format check
        run: cargo fmt --all --check

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # Tauri's Linux dependencies. Required even for `cargo test --lib`
      # because the test binary links against tauri / webkit / gtk system
      # libs at compile time. Skip on macOS / Windows (handled natively).
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build (tsc + vite)
        run: pnpm build

      # Not just for the bundle: `tauri-build` validates `externalBin` while it
      # runs as src-tauri's build script, so a missing sidecar fails every cargo
      # command below — clippy and test included, long before anything is
      # packaged. `tauri dev` / `tauri build` stage it through their before-
      # commands; a bare cargo invocation has to be told.
      - name: Stage the CLI sidecar
        run: pnpm sidecar

      # `--all-targets` so test code is linted too, and on the full OS matrix
      # rather than once: `cfg`-gated code is only ever seen by its own target,
      # so a Windows-only branch is unlinted anywhere else.
      - name: Rust lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The feature-gated build a headless consumer gets: core must compile
      # with `llm` and `git` off, or the gating has regressed.
      - name: Core without default features
        run: cargo check -p tidycraft-core --no-default-features

      # `--bins` because tidycraft-cli is a bin crate: its unit tests live in
      # the bin target and `--lib` alone would silently skip them.
      - name: Backend tests
        run: cargo test --workspace --lib --bins --no-fail-fast
