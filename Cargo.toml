[workspace]
resolver = "2"
members = ["crates/tidycraft", "crates/tidycraft-core", "src-tauri"]

[workspace.package]
version = "0.9.0"
authors = ["Tidycraft Team"]
edition = "2021"
# Floor imposed by the dependency graph, not by our own code: tauri 2.11
# needs 1.77.2 and `time` 0.3.47 (via cookie/reqwest and tauri-codegen) needs
# 1.88. Cargo enforces each dependency's own `rust-version`, so anything lower
# here is a claim the build cannot honor. CI pins `stable`, which is why the
# stale 1.75 never failed anything — recheck with
# `cargo metadata --format-version 1` after a dependency bump.
rust-version = "1.88"
license = "AGPL-3.0-only"
homepage = "https://github.com/Lynthar/Tidycraft"
repository = "https://github.com/Lynthar/Tidycraft"

# Every crate opts in with `[lints] workspace = true`. The gate runs clippy with
# `-D warnings`, so a `warn` here fails the gate.
[workspace.lints.rust]
unsafe_code = "forbid"
# The group must sit below the single lints, or `lint_groups_priority` fires.
unused = { level = "deny", priority = -1 }

# Only pedantic lints that guard an invariant; style-only ones stay off.
[workspace.lints.clippy]
# Numeric casts and arithmetic that silently wrap, truncate or panic.
cast_possible_wrap = "warn"
checked_conversions = "warn"
float_cmp = "warn"
invalid_upcast_comparisons = "warn"
manual_midpoint = "warn"
unchecked_time_subtraction = "warn"
maybe_infinite_iter = "warn"
# Matches: a new variant must break the build, an `Err` arm must not be `_`.
match_wildcard_for_single_variants = "warn"
match_wild_err_arm = "warn"
ignored_unit_patterns = "warn"
same_functions_in_if_condition = "warn"
# Strings and paths: extension case, NFC literals, `{:?}` on paths.
case_sensitive_file_extension_comparisons = "warn"
unicode_not_nfc = "warn"
unnecessary_debug_formatting = "warn"
# Tests: an `#[ignore]` needs a reason, a `#[should_panic]` its message.
ignore_without_reason = "warn"
should_panic_without_expect = "warn"
# Names and imports: `_x` means unused; a glob captures new names silently.
used_underscore_binding = "warn"
used_underscore_items = "warn"
no_effect_underscore_binding = "warn"
wildcard_imports = "warn"
enum_glob_use = "warn"
# API shape of the published crates.
copy_iterator = "warn"
iter_not_returning_iterator = "warn"
into_iter_without_iter = "warn"
iter_without_into_iter = "warn"
expl_impl_clone_on_copy = "warn"
missing_fields_in_debug = "warn"
mismatching_type_param_order = "warn"
pub_underscore_fields = "warn"
doc_broken_link = "warn"
# Bit tricks: std has the primitive; a hand-rolled one hides the edge case.
manual_is_power_of_two = "warn"
manual_ilog2 = "warn"
# `&mut &mut` is a mistake, not a type.
mut_mut = "warn"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
