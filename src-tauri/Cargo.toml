[package]
name = "tidycraft"
description = "Game asset management tool"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "tidycraft_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Not `tidycraft`: that name belongs to the CLI's binary, and two bin targets
# writing one path in the shared workspace target directory overwrite each
# other — the winner decided by build order, and a hard failure while the
# desktop app is running and holding its own exe open. Tauri takes whatever
# cargo emits, so naming it here is the whole fix; `mainBinaryName` is not
# involved (it only applies to `tauri build`, and is unreliable for .deb).
[[bin]]
name = "tidycraft-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tidycraft-core = { path = "../crates/tidycraft-core" }
# No `devtools` feature: debug builds get the inspector automatically
# (tauri enables it under `debug_assertions`, and lib.rs's setup hook
# auto-opens it there); the feature's only effect was compiling the
# inspector into RELEASE builds, where it exposed localStorage (and the
# plaintext API key) to anyone at the machine. Re-add temporarily if a
# production-build issue ever needs on-site inspection.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
dirs = "5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "tiff", "webp", "hdr", "exr"] }
trash = "5"
notify = "6"
notify-debouncer-full = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
